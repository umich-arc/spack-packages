    - python@3.13.13
    - flexiblas@3.4.2
    - boost@1.78.0
    - geos@3.14.1
    - openmpi@5.0.10
    - openblas@0.3.33
    - openjdk@18.0.1.1
    - netlib-lapack@3.12.1
    - libaec@1.1.4
    - proj@9.7.0
    - hdf5@1.14.6+cxx+fortran+hl~ipo~java~map~mpi+shared+szip+threadsafe+tools ^libaec@1.1.4
    - netcdf-cxx4 ^netcdf-c~mpi~parallel-netcdf ^hdf5+cxx+fortran+hl~mpi
    - netcdf-fortran ^netcdf-c~mpi~parallel-netcdf ^hdf5+cxx+fortran+hl~mpi
    # gdal to use non-threadsafe netcdfc family
    - gdal@3.6.3+armadillo+blosc+hdf5+hdf4+gif ^arpack-ng~mpi ^arrow@18 ^json-c@0.14 ^netcdf-c~mpi~parallel-netcdf ^hdf5+cxx+fortran+hl~mpi ^ninja^python@3.13.13+libxml2
    - libjpeg-turbo@3.1.3
    - libtiff@4.7.1
    - sqlite@3.53.1
    - archivetar@0.18.2 ^python@3.13.13 ^openmpi@5.0.10
    - libsodium@1.0.22
    - libgd@2.3.3
    #- cuda@12.9.1
    #- cuda@13.3.0
    #- cudnn@9.21.0.82-12 ^cuda@12.9.1
    #- cudnn@9.21.0.82-13 ^cuda@13.3.0
    - bioinformatics@1.0
    override:
      packages:
        c:
          prefer: [gcc@8.5.0]
        cxx:
          prefer: [gcc@8.5.0]
        fortran:
          prefer: [gcc@8.5.0]
        python:
          require:
          - "+arc"
        openmpi:
          require:
          - "+arc"
