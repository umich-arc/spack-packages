# This is a Spack Environment file.
#
# It describes a set of packages to be installed, along with
# configuration settings.
spack:
  view: false
  specs:
  - group: gcc-8
    specs:
    - python@3.13.13+arc
    - boost@1.78.0
    - geos@3.14.1
    - openmpi@5.0.10+arc
    - openblas@0.3.33
    - openjdk@18.0.1.1
    - netlib-lapack@3.12.1
    - libaec@1.1.4
    - proj@9.7.0
    - hdf5@1.14.6+hl+cxx+fortran
    - libjpeg-turbo@3.1.3
    - libtiff@4.7.1
    - netcdf-c@4.7.4 ^hdf5@1.14.6+hl+cxx+fortran ^libaec@1.1.4
    - netcdf-cxx4@4.3.1 ^netcdf-c@4.7.4 ^hdf5@1.14.6+hl+cxx+fortran ^libaec@1.1.4
    - netcdf-fortran@4.6.2 ^netcdf-c@4.7.4 ^hdf5@1.14.6+hl+cxx+fortran ^libaec@1.1.4
    - gdal@3.6.3 ^netcdf-c@4.7.4 ^hdf5@1.14.6+hl+cxx+fortran ^libaec@1.1.4
    - sqlite@3.53.1
    - archivetar@0.18.2 ^python@3.13.13+arc ^openmpi@5.0.10+arc
    - libsodium@1.0.22
    - libgd@2.3.3
    - r@4.6.1+arc ^flexiblas@3.4.2 ^libjpeg-turbo@3.1.3 ^libtiff@4.7.1 ^libpng@1.6.58
    - r@4.6.0+arc ^flexiblas@3.4.2 ^libjpeg-turbo@3.1.3 ^libtiff@4.7.1 ^libpng@1.6.58
    - rtidyverse@2.0.0 ^libjpeg-turbo@3.1.3 ^libtiff@4.7.1 ^libpng@1.6.58 ^r@4.6.1+arc ^flexiblas@3.4.2
    - rtidyverse@2.0.0 ^libjpeg-turbo@3.1.3 ^libtiff@4.7.1 ^libpng@1.6.58 ^r@4.6.0+arc ^flexiblas@3.4.2
    # wont build with gcc 8.5.0, but leaving it here for the future.
    #- rgeospatial ^rtidyverse@2.0.0 ^r@4.6.0+arc ^flexiblas ^jpeg ^libtiff ^libpng ^gdal@3.6.3 ^netcdf-c@4.7.4 ^hdf5@1.14.6+hl+cxx+fortran ^libaec@1.1.4
    - cuda@12.9.1
    - cuda@13.3.0
    - cudnn@9.21.0.82-12 ^cuda@12.9.1
    - cudnn@9.21.0.82-13 ^cuda@13.3.0
    - bioinformatics@1.0
    override:
      packages:
        c:
          prefer: [gcc@8.5.0]
        cxx:
          prefer: [gcc@8.5.0]
        fortran:
          prefer: [gcc@8.5.0]
  - group: gcc-15.1.0
    specs:
    - python@3.13.13+arc
    - boost@1.78.0
    - geos@3.14.1
    - openmpi@5.0.10+arc
    - openblas@0.3.33
    - netlib-lapack@3.12.1
    - libaec@1.1.4
    - proj@9.7.0
    - hdf5@1.14.6+hl+cxx+fortran
    - libjpeg-turbo@3.1.3
    - libtiff@4.7.1
    - netcdf-c@4.7.4 ^hdf5@1.14.6+hl+cxx+fortran ^libaec@1.1.4
    - netcdf-cxx4@4.3.1 ^netcdf-c@4.7.4 ^hdf5@1.14.6+hl+cxx+fortran ^libaec@1.1.4
    - netcdf-fortran@4.6.2 ^netcdf-c@4.7.4 ^hdf5@1.14.6+hl+cxx+fortran ^libaec@1.1.4
    - gdal@3.6.3 ^netcdf-c@4.7.4 ^hdf5@1.14.6+hl+cxx+fortran ^libaec@1.1.4
    - gdal@3.13.1 ^netcdf-c@4.7.4 ^hdf5@1.14.6+hl+cxx+fortran ^libaec@1.1.4
    - sqlite@3.53.1
    - libsodium@1.0.22
    - libgd@2.3.3
    - r@4.6.1+arc ^flexiblas@3.4.2 ^libjpeg-turbo@3.1.3 ^libtiff@4.7.1 ^libpng@1.6.58
    - rtidyverse@2.0.0 ^libjpeg-turbo@3.1.3 ^libtiff@4.7.1 ^libpng@1.6.58 ^r@4.6.1+arc ^flexiblas@3.4.2
    - rgeospatial@1.5-18 ^rtidyverse@2.0.0 ^r@4.6.1+arc ^flexiblas@3.4.2 ^libjpeg-turbo@3.1.3 ^libtiff@4.7.1 ^libpng@1.6.58 ^gdal@3.13.1 ^netcdf-c@4.7.4 ^hdf5@1.14.6+hl+cxx+fortran ^libaec@1.1.4
    override:
        packages:
          c:
            prefer: [gcc@15.1.0]
          cxx:
            prefer: [gcc@15.1.0]
          fortran:
            prefer: [gcc@15.1.0]
  - group: gcc-10.3.0
    specs:
    - python@3.13.13+arc
    - boost@1.78.0
    - geos@3.14.1
    - openmpi@5.0.10+arc
    - openblas@0.3.33
    - netlib-lapack@3.12.1
    - libaec@1.1.4
    - proj@9.7.0
    - hdf5@1.14.6+hl+cxx+fortran
    - libjpeg-turbo@3.1.3
    - libtiff@4.7.1
    - netcdf-c@4.10.0 ^hdf5@1.14.6+hl+cxx+fortran ^libaec@1.1.4
    - netcdf-cxx4@4.3.1 ^netcdf-c@4.10.0 ^hdf5@1.14.6+hl+cxx+fortran ^libaec@1.1.4
    - netcdf-fortran@4.6.2 ^netcdf-c@4.10.0 ^hdf5@1.14.6+hl+cxx+fortran ^libaec@1.1.4
    - gdal@3.13.1 ^netcdf-c@4.10.0 ^hdf5@1.14.6+hl+cxx+fortran ^libaec@1.1.4
    - sqlite@3.53.1
    #- archivetar@0.18.2 ^python@3.13.13+arc ^openmpi@5.0.10+arc
    - libsodium@1.0.22
    - libgd@2.3.3
    - r@4.6.1+arc ^flexiblas@3.4.2 ^libjpeg-turbo@3.1.3 ^libtiff@4.7.1 ^libpng@1.6.58
    - rtidyverse@2.0.0 ^libjpeg-turbo@3.1.3 ^libtiff@4.7.1 ^libpng@1.6.58 ^r@4.6.1+arc ^flexiblas@3.4.2
    override:
        packages:
          c:
            prefer: [gcc@10.3.0]
          cxx:
            prefer: [gcc@10.3.0]
          fortran:
            prefer: [gcc@10.3.0]
  - group: llvm-22.1.3
    specs:
    - geos
    #- openmpi %llvm@22.1.3
    #- flexiblas %llvm@22.1.3
    - libaec
    - proj
    #- gdal@3.13.1 ^netcdf-c ^hdf5+hl+cxx+fortran
    - hdf5+hl+cxx+fortran
    - libjpeg-turbo
    - libtiff
    - netcdf-c ^hdf5+hl+cxx+fortran
    - netcdf-cxx4 ^netcdf-c ^hdf5+hl+cxx+fortran
    - netcdf-fortran ^netcdf-c ^hdf5+hl+cxx+fortran
    - sqlite
    override:
        packages:
          c:
            prefer: [llvm@22.1.3]
          cxx:
            prefer: [llvm@22.1.3]
          fortran:
            prefer: [llvm@22.1.3]
  - group: intel-classic-compiler
    specs:
    - boost
    #- openmpi
    #- flexiblas
    - fftw~mpi
    - libaec %intel-oneapi-compilers-classic@2021.5.0
    - hdf5+hl+cxx+fortran
    - netcdf-c ^hdf5+hl+cxx+fortran
    - netcdf-cxx4 ^netcdf-c ^hdf5+hl+cxx+fortran
    - netcdf-fortran ^netcdf-c ^hdf5+hl+cxx+fortran
    override:
        packages:
          c:
            prefer: [intel-oneapi-compilers-classic@2021.5.0]
          cxx:
            prefer: [intel-oneapi-compilers-classic@2021.5.0]
          fortran:
            prefer: [intel-oneapi-compilers-classic@2021.5.0]
  concretizer:
    unify: false
    reuse: true
  packages:
    gcc:
      externals:
      - spec: gcc@8.5.0 languages:='c,c++,fortran'
        prefix: /usr
        extra_attributes:
          compilers:
            c: /usr/bin/gcc
            cxx: /usr/bin/g++
            fortran: /usr/bin/gfortran
      - spec: gcc@10.3.0 languages:='c,c++,fortran'
        prefix: /sw/pkgs/arc/gcc/10.3.0
        extra_attributes:
          compilers:
            c: /sw/pkgs/arc/gcc/10.3.0/bin/gcc
            cxx: /sw/pkgs/arc/gcc/10.3.0/bin/g++
            fortran: /sw/pkgs/arc/gcc/10.3.0/bin/gfortran
      - spec: gcc@15.1.0 languages:='c,c++,fortran'
        prefix: /sw/pkgs/arc/gcc/15.1.0
        extra_attributes:
          compilers:
            c: /sw/pkgs/arc/gcc/15.1.0/bin/gcc
            cxx: /sw/pkgs/arc/gcc/15.1.0/bin/g++
            fortran: /sw/pkgs/arc/gcc/15.1.0/bin/gfortran
    llvm:
      externals:
      - spec: llvm@22.1.3+flang openmp=runtime
        prefix: /sw/pkgs/arc/llvm/22.1.3
        extra_attributes:
          compilers:
            c: /sw/pkgs/arc/llvm/22.1.3/bin/clang
            cxx: /sw/pkgs/arc/llvm/22.1.3/bin/clang++
            fortran: /sw/pkgs/arc/llvm/22.1.3/bin/flang
          extra_rpaths:
          - /sw/pkgs/arc/llvm/22.1.3/lib/x86_64-unknown-linux-gnu/
          environment:
                  prepend_path:
                          LD_LIBRARY_PATH: /sw/pkgs/arc/llvm/22.1.3/lib/x86_64-unknown-linux-gnu/
    intel-oneapi-compilers-classic:
      externals:
      - spec: intel-oneapi-compilers-classic@2021.5.0
        prefix: /sw/pkgs/arc/intel/2022.1.2/compiler/2022.0.2/linux
        extra_attributes:
          compilers:
            c: /sw/pkgs/arc/intel/2022.1.2/compiler/2022.0.2/linux/bin/intel64/icc
            cxx: /sw/pkgs/arc/intel/2022.1.2/compiler/2022.0.2/linux/bin/intel64/icpc
            fortran: /sw/pkgs/arc/intel/2022.1.2/compiler/2022.0.2/linux/bin/intel64/ifort
          flags:
            ldflags: -L/sw/pkgs/arc/intel/2022.1.2/compiler/2022.0.2/linux/compiler/lib/intel64_lin/
          extra_rpaths:
          - /sw/pkgs/arc/intel/2022.1.2/compiler/2022.0.2/linux/compiler/lib/intel64_lin/
          environment:
            prepend_path:
              LD_LIBRARY_PATH: /sw/pkgs/arc/intel/2022.1.2/compiler/2022.0.2/linux/compiler/lib/intel64_lin/
    perl:
      externals:
      - spec: perl@5.26.3
        prefix: /usr
  modules:
    default:
      roots:
        lmod: /sw/pkgs/arc/staging/spack/modules
        tcl: /sw/pkgs/arc/staging/spack/modules
      lmod:
        projections:
          r: 'R/{version}'
          intel-oneapi-compilers-classic: 'intel/{version}'
        hash_length: 0
        hierarchy:
          - r
          - mpi
        core_specs:
        - gcc@8.5.0
        - gcc-runtime@8.5.0
        - gcc@10.3.0
        - gcc@15.1.0
        - llvm@22.1.3
        - intel-oneapi-compilers-classic@2021.5.0
        exclude:
        - gcc-runtime@8.5.0
        - glibc
        - autoconf
        - compiler-wrapper
