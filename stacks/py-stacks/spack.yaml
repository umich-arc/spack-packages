# This is a Spack Environment file.
#
# It describes a set of packages to be installed, along with
# configuration settings.
spack:
  config:
    install_tree:
      root: /sw/spack/opt/pkgs
  upstreams:
    arc-compiler-stacks:
      install_tree: /sw/spack/opt/pkgs
      modules:
        lmod: /sw/spack/opt/modules
  view: false
  specs:
  ##########################################################################################
  #                                       Software                                         #
  ##########################################################################################
  - group: Python stacks
    specs:
    - py-globus-cli
    - py-uv@0.13.4
    - awscli
    - reframe+analytics
    override:
      packages:
        c:
          prefer: [gcc@14.4.0]
        cxx:
          prefer: [gcc@14.4.0]
        fortran:
          prefer: [gcc@14.4.0]
        python:
          require:
          - +arc
          - one_of: ["@3.13.17", "@3.14.9", "@3.15.1"]
        openmpi:
          require:
          - +arc
        r:
          require:
          - +arc
  - group: Scientific Python
    specs:
    - py-ipython
    - py-matplotlib
    - py-networkx
    - py-scikit-image
    - py-scikit-learn
    - py-xarray
    override:
      packages:
        c:
          prefer: [gcc@14.4.0]
        cxx:
          prefer: [gcc@14.4.0]
        fortran:
          prefer: [gcc@14.4.0]
        python:
          require:
          - +arc
          - one_of: ["@3.13.17", "@3.14.9", "@3.15.1"]
      config:
        install_tree:
          root: /sw/spack/scientific-python/opt/pkgs
      concretizer:
        reuse:
          roots: true
          exclude:
          - python
          - ^python
      modules:
        default:
          roots:
            lmod: /sw/spack/scientific-python/opt/modules
            tcl: /sw/spack/scientific-python/opt/modules
          lmod:
            projections:
              py-ipython: ipython/{version}
              py-matplotlib: matplotlib/{version}
              py-networkx: networkx/{version}
              py-numpy: numpy/{version}
              py-scikit-image: scikit-image/{version}
              py-scikit-learn: scikit-learn/{version}
              py-scipy: scipy/{version}
              py-xarray: xarray/{version}
              r: R/{version}
              hdf5~threadsafe: hdf5/{version}-nonatomic
              intel-oneapi-compilers-classic: intel/{version}
              miniforge3: mamba/{version}
              py-mpi4py: mpi4py/{version}
            hash_length: 0
            hide_implicits: true
            core_compilers:
            - gcc@14.4.0
            hierarchy::
            - python
            - mpi
            core_specs:
            - gcc@14.4.0
            - gcc-runtime@14.4.0
            exclude:
            - gcc-runtime@14.4.0
            - glibc
            - autoconf
            - compiler-wrapper
            - util-macros
            - poppler-data
            - python-venv
            gcc-runtime:
              template: gcc-runtime.lua
            python:
              template: python.lua
  concretizer:
    unify: when_possible
    reuse: true
    compiler_mixing: true
    ##########################################################################################
    #                                         Modules                                        #
    ##########################################################################################
  modules:
    default:
      roots:
        lmod: /sw/spack/opt/modules
        tcl: /sw/spack/opt/modules
      lmod:
        projections:
          r: R/{version}
          hdf5~threadsafe: hdf5/{version}-nonatomic
          intel-oneapi-compilers-classic: intel/{version}
          miniforge3: mamba/{version}
          py-mpi4py: mpi4py/{version}
          py-globus-cli: globus-cli/{version}
          py-uv: uv/{version}
        hash_length: 0
        hide_implicits: true
        core_compilers:
        - gcc@14.4.0
        hierarchy:
        - r
        - mpi
        core_specs:
        - gcc@14.4.0
        - gcc-runtime@14.4.0
        exclude:
        - gcc-runtime@14.4.0
        - glibc
        - autoconf
        - compiler-wrapper
        - util-macros
        - poppler-data        
        - python-venv
        gcc-runtime:
          template: gcc-runtime.lua
        python:
          template: python.lua
