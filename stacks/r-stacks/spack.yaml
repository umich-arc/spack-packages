# This is a Spack Environment file.
#
# It describes a set of packages to be installed, along with
# configuration settings.
spack:
  config:
    install_tree:
      root: /sw/spack/opt/pkgs
  view: false
  specs:
  ##########################################################################################
  #                                       Software                                         #
  ##########################################################################################
  - group: R stacks
    specs:
    - matrix:
      - - rtidyverse@2.0.0_R4.6.1 ^r/syb3ml3
        - rtidyverse@2.0.0_R4.5.3 ^r/vz5no6r
        - rgeospatial@1.5-18_R4.5.3 ^r/vz5no6r 
        - rgeospatial@1.5-18_R4.6.1 ^r/syb3ml3
        - rseurat@5.5.1_R4.6.1
        - rglmgampoi@1.24.0_R4.6.1 
        - rchipenrich@2.36.0_R4.6.1 
        - gdal/y6croxy
      - - '%c,cxx=gcc@14.4.0'
    override:
      packages:
        c:
          prefer: [gcc@14.4.0]
        cxx:
          prefer: [gcc@14.4.0]
        fortran:
          prefer: [gcc@14.4.0]
        python:
          require:
          - +arc
        openmpi:
          require:
          - +arc
        r:
          require:
          - one_of: ['@4.3.1', '@4.5.3', '@4.6.1']
        gdal:
          require:
          - +blosc+arrow+hdf4+hdf5+liblzma+libxml2+poppler+parquet+libaec+zstd+webp+sfcgal+pcre2+lz4+deflate+avif+freexl+jxl+heif
          - spec: '@3.13.2+armadillo'
            when: '%gcc@10.3.0:'
        sfcgal:
          prefer:
          - +eigen
        arrow:
          require:
          - +brotli+bz2+csv+compute+dataset+filesystem+ipc+mimalloc~orc+parquet~python+shared~snappy+zlib+zstd
        json-c:
          prefer:
          - '@0.16'
        libheif:
          prefer:
          - ~gdk-plugin
        highway:
          prefer:
          - "@1.0.7"
        boost:
          prefer:
          - "/qvozv7c"
        py-macs2:
          require:
          - "^py-cython@0.29.36 ^python@3.11"
  - group: R archr
    specs:
    - matrix:
      - - rarchr@1.0.3_R4.6.1 ^r/syb3ml3
      - - '%c,cxx=gcc@14.4.0'
    override:
      packages:
        c:
          prefer: [gcc@14.4.0]
        cxx:
          prefer: [gcc@14.4.0]
        fortran:
          prefer: [gcc@14.4.0]
  - group: R non-mpi
    specs:
    - matrix:
      - - rmonocle3@1.4.27_R4.6.1
        - gdal/cahpfny
      - - '%c,cxx=gcc@14.4.0'
    override:
      packages:
        all:
          require:
          - ~mpi
        json-c:
          prefer:
          - '@0.16'
        c:
          prefer: [gcc@14.4.0]
        cxx:
          prefer: [gcc@14.4.0]
        fortran:
          prefer: [gcc@14.4.0]
      
  concretizer:
    unify: false
    reuse: true
    ##########################################################################################
    #                                         Modules                                        #
    ##########################################################################################
  modules:
    default:
      roots:
        lmod: /sw/spack/opt/modules
        tcl: /sw/spack/opt/modules
      lmod:
        projections:
          r: R/{version}
          hdf5~threadsafe: hdf5/{version}-nonatomic
          intel-oneapi-compilers-classic: intel/{version}
          miniforge3: mamba/{version}
          py-mpi4py: mpi4py/{version}
        rtidyverse:
          suffixes:
            '^openmpi@:5.0.9,5.0.11:': 'ompi{^openmpi.version}'
        rgeospatial:
          suffixes:
            '^openmpi@:5.0.9,5.0.11:': 'ompi{^openmpi.version}'
        hash_length: 0
        hide_implicits: true
        core_compilers:
        - gcc@14.4.0
        hierarchy:
        - r
        - mpi
        core_specs:
        - gcc@14.4.0
        - gcc-runtime@14.4.0
        exclude:
        - gcc-runtime@14.4.0
        - glibc
        - autoconf
        - compiler-wrapper
        - util-macros
        - poppler-data
        - python-venv
        gcc-runtime:
          template: gcc-runtime.lua
        python:
          template: python.lua
