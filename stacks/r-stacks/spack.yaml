# This is a Spack Environment file.
#
# It describes a set of packages to be installed, along with
# configuration settings.
spack:
  config:
    install_tree:
      root: /sw/spack/opt/pkgs
  view: false
  packages:
    r:
      externals::
      - spec: r@4.3.1
        prefix: /sw/spack/opt/pkgs/r/4.3.1-gcc-14.4.0-hgr2
      - spec: r@4.5.3
        prefix: /sw/spack/opt/pkgs/r/4.5.3-gcc-14.4.0-vz5n
      - spec: r@4.6.1
        prefix: /sw/spack/opt/pkgs/r/4.6.1-gcc-14.4.0-syb3
      buildable: false
  specs:
  ##########################################################################################
  #                                       Software                                         #
  ##########################################################################################
  - group: R stacks
    specs:
    - matrix:
      - - rtidyverse@2.0.0_R4.6.1
        - rgeospatial@1.5-18_R4.5.3 ^libtiff@4.7.1 ^gdal ^poppler@21.09.0 ^proj@9.7.0 ^geos@3.14.1 ^netcdf-fortran@4.6.2 ^hdf5@1.14.6 ^openjdk
        - rtidyverse@2.0.0_R4.6.1 
        - rgeospatial@1.5-18_R4.6.1 ^libtiff@4.7.1 ^gdal ^poppler@21.09.0 ^proj@9.7.0 ^geos@3.14.1 ^netcdf-fortran@4.6.2 ^hdf5@1.14.6 ^openjdk 
        - rseurat@5.5.1_R4.6.1 ^r-reticulate@1.46.0 ^r-dotcall64@1.2
        - rmonocle3@1.4.27_R4.6.1 ^hdf+shared
        - rglmgampoi@1.24.0_R4.6.1 
        - rchipenrich@2.36.0_R4.6.1 
        #- rarchr@1.0.3_R4.6.1 ^r@4.6.1/hsmq64i
      - - '%c,cxx=gcc@14.4.0'
    override:
      packages:
        c:
          prefer: [gcc@14.4.0]
        cxx:
          prefer: [gcc@14.4.0]
        fortran:
          prefer: [gcc@14.4.0]
        python:
          require:
          - +arc
        openmpi:
          require:
          - +arc
        r:
          require:
          - +arc
        r-proxy:
          require: ['@0.4-29']
        r-rpart:
          require: ['@4.1.27']
        r-geometries:
          require: ['@0.2.5']
        r-zoo:
          require: ['@1.8-15']
        r-igraph:
          require: ['@2.3.3']
        r-spatstat-random:
          require: ['@3.5-1']
        r-maps:
          require: ['@3.4.3']
        r-jsonify:
          require: ['@1.2.3']
        r-s2:
          require: ['@1.1.12']
        r-rcpp:
          require: ['@1.1.0:']
        r-rapidjsonr:
          require: ['@1.2.1:']
        r-cpp11:
          require: ['@0.5.0:']
        gdal:
          require:
          - +blosc+arrow+hdf4+hdf5+liblzma+libxml2+poppler+parquet+libaec+zstd+webp+sfcgal+pcre2+lz4+deflate+avif+freexl+jxl+heif
          - spec: '@3.13.2+armadillo'
            when: '%gcc@10.3.0:'
        sfcgal:
          prefer:
          - +eigen
        arrow:
          require:
          - +brotli+bz2+csv+compute+dataset+filesystem+ipc+mimalloc~orc+parquet~python+shared~snappy+zlib+zstd
        json-c:
          prefer:
          - '@0.16'
        libheif:
          prefer:
          - ~gdk-plugin
        highway:
          prefer:
          - "@1.0.7"
        meson:
          prefer:
          - "/jtv2mgc"
        curl:
          require:
          - "/mlxgqdb"
        compiler-wrapper:
          prefer:
          - "/ab637if"
  concretizer:
    unify: when_possible
    reuse: true
    ##########################################################################################
    #                                         Modules                                        #
    ##########################################################################################
  modules:
    default:
      roots:
        lmod: /sw/spack/opt/RStacks
        tcl: /sw/spack/opt/RStacks
      lmod:
        projections:
          r: R/{version}
          hdf5~threadsafe: hdf5/{version}-nonatomic
          intel-oneapi-compilers-classic: intel/{version}
          miniforge3: mamba/{version}
          py-mpi4py: mpi4py/{version}
        rtidyverse:
          suffixes:
            '^openmpi@:5.0.9,5.0.11:': 'ompi{^openmpi.version}'
        rgeospatial:
          suffixes:
            '^openmpi@:5.0.9,5.0.11:': 'ompi{^openmpi.version}'
        hash_length: 0
        #hide_implicits: true
        core_compilers:
        - gcc@14.4.0
        hierarchy:
        - r
        - mpi
        core_specs:
        - gcc@14.4.0
        - gcc-runtime@14.4.0
        exclude:
        - gcc-runtime@14.4.0
        - glibc
        - autoconf
        - compiler-wrapper
        - util-macros
        - poppler-data
        - python-venv
        gcc-runtime:
          template: gcc-runtime.lua
