# This is a Spack Environment file.
#
# It describes a set of packages to be installed, along with
# configuration settings.
spack:
  config:
      install_tree:
        root: /sw/spack/opt/pkgs
  view: false
  specs:
  ##########################################################################################
  #                                       Software                                         #
  ##########################################################################################
  - group: paraview
    specs:
    - ispc/y5ga4wt # needed for ospray as runtime dependency
    - paraview@6.1.1+cuda+mpi+qt+raytracing+hdf5+python cuda_arch=80 ^ninja@1.13.2 ^python@3.10
    - paraview@6.1.1~cuda~mpi+qt+raytracing+hdf5+python ^ninja@1.13.2 ^python@3.10
    - paraview@6.1.0+cuda+mpi+qt+raytracing+hdf5+python cuda_arch=80 ^ninja@1.13.2 ^python@3.10
    - paraview@6.1.0~cuda~mpi+qt+raytracing+hdf5+python ^ninja@1.13.2 ^python@3.10
  - group: paraview-5
    specs:
    - paraview@5~cuda~mpi+qt+raytracing+hdf5+python ^ninja@1.13.2 ^python@3.10 ^fontconfig/iolzgck
  - group: tomviz-3
    specs:
    - tomviz@3.0.0 ^python@3.10
  concretizer:
    unify: false
    reuse: true
    ##########################################################################################
    #                                         Modules                                        #
    ##########################################################################################
  modules:
    default:
      roots:
        lmod: /sw/spack/opt/modules
        tcl: /sw/spack/opt/modules
      lmod:
        projections:
          r: 'R/{version}'
          hdf5~threadsafe: 'hdf5/{version}-nonatomic'
          intel-oneapi-compilers-classic: 'intel/{version}'
          miniforge3: 'mamba/{version}'
          py-mpi4py: 'mpi4py/{version}'
          intel-oneapi-mpi: 'impi/{version}'
          gh: 'github-cli/{version}'
          paraview~mpi~cuda: 'paraview/{version}-nompicuda'
          ninja: 'ninja/{version}-py{^python.version.up_to_2}'
        hash_length: 0
        all:
          suffixes:
            # Keep distinct builds from overwriting modules owned by earlier stacks.
            '/iolzgckz5jjr7hfuvjwou6hnceghj3ko': paraview # fontconfig@2.15.0
            #'/tyxecpqhlzighn7cmzmwxxky5iwngbgv': paraview # glew@2.3.1
            '/x3l5a2mhruryicz56thlvl4dggxdzubj': paraview # glib-bootstrap@2.88.2
            '/mpfvhwtibzlygmvtvcbeo5s5aylc7nyk': paraview # glib@2.88.2
            '/2wxc7xoffmxwcikmeyebvgn3qmwdq5kq': paraview # gobject-introspection@1.86.0
            '/u54qqq7n6s25vktylwcuvkpcfcke23ck': paraview # harfbuzz@11.5.1
            '/h4hvbmz5slbfaol3fdh75644pk2ttpsm': paraview # perl@5.40.2
            '/b6vzyzk52s6mt3jxdw3sd6mwvuhdbu75': paraview # py-mpi4py@4.1.1
            '/c6lhkrhz3lqnhnrzpx77oaf732wm72o6': paraview # py-packaging@26.2
            '/mheerxd6ko4xsiexdebeqszicxpqrqfh': paraview # py-pillow@12.3.0
            '/hda7fmlh52z7dfuper7c4gipaei6fhnr': paraview # py-pygments@2.20.0
            'binutils target=x86_64': x86_64
            'gmp target=x86_64': x86_64
            'mpc target=x86_64': x86_64
            'mpfr target=x86_64': x86_64
            'zlib-ng target=x86_64': x86_64
            'zstd target=x86_64': x86_64
        core_compilers:
          - gcc@14.3.1
        hierarchy:
          - r
          - mpi
        core_specs:
        - gcc@14.3.1
        - gcc-runtime@14.3.1
        exclude:
        - gcc-runtime@14.3.1
        - glibc
        - autoconf
        - compiler-wrapper
        - util-macros
        - py-pip
        - py-setuptools
        - py-wheel
        - py-cython
        - python-venv
        gcc-runtime:
          template: gcc-runtime.lua
        miniforge3:
          environment:
            set:
              CONDA_ENVS_PATH: "~/.conda/envs"
              CONDA_PKGS_DIRS: "~/.conda/pkgs"
        openmpi@5.0.10+arc:
          environment:
            set:
              UCX_LOG_LEVEL: error
        intel-oneapi-mpi@2021.18.0:
          environment:
            set:
              SLURM_MPI_TYPE: pmi2
              I_MPI_HYDRA_BOOSTRAP: slurm
              I_MPI_PMI_LIBRARY: /usr/lib64/libpmi2.so
        aocc@5.2.0:
          environment:
            prepend_path:
              MODULEPATH: /sw/spack/chemistry/opt/modules/linux-rhel10-x86_64/aocc/5.2.0
