# This is a Spack Environment file.
#
# It describes a set of packages to be installed, along with
# configuration settings.
spack:
  config:
      install_tree:
        root: /sw/spack/opt/pkgs
  #mirrors:
  #  buildcache: file:///sw/spack/buildcache
  view: false
  specs:
  ##########################################################################################
  #                                       Software                                         #
  ##########################################################################################
  - group: Base-GCC14-Compiler
    specs:
    - argtable cflags="-Wno-error=implicit-function-declaration"
    - gcc@14.4.0
    - python@3.15.1
    - python@3.14.9
    - python@3.13.17
    - miniforge3@26.3.2-3+notebook+pytorch pytorch-cuda=13
    - armadillo ^flexiblas
    - flexiblas@3.4.2
    - boost@1.90.0~mpi
    - boost@1.89.0~mpi
    - geos@3.14.1
    - openmpi@5.0.10
    - openmpi@5.0.10+arc+cuda
    - mvapich2
    - openblas@0.3.33
    - netlib-lapack@3.12.1
    - libaec@1.1.4
    - libxcrypt+obsolete_api
    - proj@9.7.0 ^libtiff@4.7.1
    - hdf5@1.14.6+cxx+fortran+hl+threadsafe~mpi+szip ^libaec@1.1.4
    - hdf5@1.14.6+cxx+fortran+hl+threadsafe+mpi+szip ^libaec@1.1.4
    - hdf5@2.1+cxx+fortran+hl+threadsafe~mpi+szip ^libaec@1.1.4
    - netcdf-c+blosc+hdf4+mpi+parallel-netcdf+szip+zstd+jna ^hdf5@1.14.6+cxx+fortran+hl+threadsafe+mpi+szip ^libaec@1.1.4
    - netcdf-cxx4 ^hdf5@1.14.6+cxx+fortran+hl+threadsafe+mpi+szip ^libaec@1.1.4
    - netcdf-fortran ^hdf5@1.14.6+cxx+fortran+hl+threadsafe+mpi+szip ^libaec@1.1.4
    - libjpeg-turbo@3.1.3
    - libtiff@4.7.1
    - libtiff@4.0.10
    - sqlite@3.53.1
    - archivetar@1.1.0 ^python@3.13.17 ^openmpi@5.0.10
    - libsodium@1.0.22
    - libgd@2.3.3
    - r@4.6.1
    - r@4.5.3
    - r@4.3.1+X+arc
    - py-mpi4py ^python@3.13.17 ^openmpi@5.0.10
    - fiji@2026.03.07
    - cuda@13.3.0
    - fftw~mpi
    - fftw+mpi
    - fftw+mpi ^mvapich2
    - ffmpeg@8.1+X+bzlib~doc+drawtext+gpl+libaom+libmp3lame+libopenjpeg~libopus~libsnappy~libspeex~libssh~libvorbis~libvpx+libwebp~libx264+libxml2+libzmq+lzma~nonfree~openssl~sdl2+shared+version3
    - mumps +complex~double+float+metis~parmetis+scotch~mpi ^scotch~mpi #^openblas/ndsuya3
    - mumps +complex+double+float+metis+parmetis+scotch+mpi #^openblas/ndsuya3 # using glibc libm
    - mumps +complex+double+float+metis+parmetis+scotch+mpi ^mvapich2 #^openblas/ndsuya3
    - ruby
    - julia@1.12.6 cpu_target=znver5 ^python@3.13.17
    #
    - lammps+mpi+lib+jpeg+png+ffmpeg+openmp+opencl+kspace~kokkos+h5md+spin %gcc@14.4.0 ^ffmpeg/j47vi2f ^hdf5/a2j2m5f # force hdf5 from earlier spec to avoid hdf5@2.1
    - gromacs+cuda+mpi %gcc@14.4.0
    - quantum-espresso %gcc@14.4.0 ^fftw/m26yrbg
    #
    - rclone 
    - jags ^openblas/ndsuya3
    - nco ^netcdf-c~mpi~parallel-netcdf ^hdf5~mpi+szip@1.14.6
    - pgplot
    - ncview ^libxaw@1.0.15 ^netcdf-c~mpi~parallel-netcdf ^hdf5~mpi+szip@1.14.6
    - gh
    - nvtop
    - petsc~mpi+openmp
    - petsc+mpi+hdf5+openmp+fftw ^hdf5/ye3d2pj # <- hdf5@1.14.6+mpi
    #- gdal/wj3bifx # comes from r-stacks
    - maven
    - amdlibm ^python/n2kczjv
    - mpifileutils@0.12
    - cmake
    - gmake
    - nasm
    - yasm
    - pbzip2 ^bzip2/5wiopfv #os external
    - llama-cpp@0.6.0 ^openblas/ndsuya3
    - trilinos+boost ^kokkos
    - patchelf
    override:
      packages:
        c:
          prefer: [gcc@14.4.0]
        cxx:
          prefer: [gcc@14.4.0]
        fortran:
          prefer: [gcc@14.4.0]
        python:
          require:
          - "+arc"
          - one_of: ["@3.13.17", "@3.14.9", "@3.15.1"]
        openmpi:
          require:
          - "+arc"
        r:
          require:
          - "+arc+X"
        hdf5:
          prefer:
          - "@2.1"
          - "+cxx+fortran+hl+mpi+szip"
        boost:
          prefer:
          - "~mpi"
  - group: compilers
    specs:
    - intel-oneapi-compilers-classic@2021.13.1
    - intel-oneapi-mpi@2021.18.0
    - aocc@5.2.0 +license-agreed
    - aocc@6.0.0 +license-agreed
    - nvhpc@26.5
    - gcc@10.3.0+binutils
    - gcc@12.3.0+binutils
    - go@1.26.5
    - rust ^python@3.13.17
    - cairo@1.18.2
    override:
      packages:
        c:
          prefer: [gcc@14.4.0]
        cxx:
          prefer: [gcc@14.4.0]
        fortran:
          prefer: [gcc@14.4.0]
        python:
          require:
          - "+arc"
          - one_of: ["@3.13.17", "@3.14.9", "@3.15.1"]
        openmpi:
          require:
          - "+arc"
  - group: imaging 
    specs:
    - freesurfer
    - fsl@6.0.5.2+cuda cuda_arch=80 ^openblas@0.3.33 ^vtk~mpi
    #
    # MPI Paraview and Tomviz, need to use a single glx hash
    - tomviz@3.0.0 ^python@3.13.17 ^paraview@6.1.1+cuda+mpi+qt+raytracing+hdf5+python cuda_arch=80 ^ninja@1.13.2 ^glx/t7nnuka ^python@3.13.17
    #
    # NO-MPI Paraview and Tomviz, need to use a single glx hash
    - paraview@5~cuda~mpi+qt+raytracing+hdf5+python ^ninja@1.13.2 ^python@3.13.17 ^glx/t7nnuka
    - tomviz@3.0.0 ^python@3.13.17 ^paraview@6.1.1~cuda~mpi+qt+raytracing+hdf5+python ^ninja@1.13.2 ^glx/t7nnuka ^python@3.13.17
    override:
      packages:
        c:
          prefer: [gcc@14.4.0]
        cxx:
          prefer: [gcc@14.4.0]
        fortran:
          prefer: [gcc@14.4.0]
  - group: workflows
    specs:
    - nextflow
    - snakemake
    override:
      packages:
        c:
          prefer: [gcc@14.4.0]
        cxx:
          prefer: [gcc@14.4.0]
        fortran:
          prefer: [gcc@14.4.0]
        python:
          require:
          - "+arc"
          - one_of: ["@3.13.17", "@3.14.9", "@3.15.1"]
        openmpi:
          require:
          - "+arc"
  concretizer:
    unify: false
    reuse: true
    ##########################################################################################
    #                                         Modules                                        #
    ##########################################################################################
  modules:
    default:
      roots:
        lmod: /sw/spack/opt/modules
        tcl: /sw/spack/opt/modules
      lmod:
        projections:
          r: 'R/{version}'
          hdf5~threadsafe+mpi: 'phdf5/{version}-nonatomic'
          hdf5~threadsafe: 'hdf5/{version}-nonatomic'
          intel-oneapi-compilers-classic: 'intel/{version}'
          miniforge3@26.3.2-3: 'mamba/py3.13'
          py-mpi4py: 'mpi4py/{version}'
          intel-oneapi-mpi: 'impi/{version}'
          gh: 'github-cli/{version}'
          hdf5+mpi: 'phdf5/{version}'
          py-globus-cli: globus-cli/{version}
          py-uv: uv/{version}
          py-ipython: ipython/{version}-py{^python.version}
          py-matplotlib: matplotlib/{version}-py{^python.version}
          py-networkx: networkx/{version}-py{^python.version}
          py-numpy: numpy/{version}-py{^python.version}
          py-scikit-image: scikit-image/{version}-py{^python.version}
          py-scikit-learn: scikit-learn/{version}-py{^python.version}
          py-scipy: scipy/{version}-py{^python.version}
          boost/zfacc: 'boost/{version}-trilinos'
          openmpi+cuda: 'openmpi/{version}-cuda'
        glew:
          suffixes:
            '^glx': glx
        gl2ps:
          suffixes:
            '^glx': glx
        vtk:
          suffixes:
            '^glx': glx
        hash_length: 0
        all:
          suffixes:
            'binutils target=x86_64': x86_64
            'gmp target=x86_64': x86_64
            'mpc target=x86_64': x86_64
            'mpfr target=x86_64': x86_64
            'zlib-ng target=x86_64': x86_64
            'zstd target=x86_64': x86_64
        core_compilers:
          - gcc@14.4.0
        hierarchy:
          - r
          - mpi
        core_specs:
        - gcc@14.4.0
        - gcc-runtime@14.4.0
        - archivetar@1.1.0
        exclude:
        #- glew
        #- mesa
        #- glx
        #- mesa-glu
        - gcc-runtime@14.4.0
        - glibc
        - autoconf
        - compiler-wrapper
        - util-macros
        - py-pip
        - py-setuptools
        - py-wheel
        - py-cython
        - python-venv
        gcc-runtime:
          template: gcc-runtime.lua
        python:
          template: python.lua
          environment:
            prepend_path:
              MODULEPATH: /sw/spack/scientific-python/opt/modules
        miniforge3:
          environment:
            set:
              CONDA_ENVS_PATH: "~/.conda/envs"
              CONDA_PKGS_DIRS: "~/.conda/pkgs"
        openmpi@5.0.10:
          environment:
            set:
              UCX_LOG_LEVEL: error
        intel-oneapi-mpi@2021.18.0:
          environment:
            set:
              SLURM_MPI_TYPE: pmi2
              I_MPI_HYDRA_BOOSTRAP: slurm
              I_MPI_PMI_LIBRARY: /usr/lib64/libpmi2.so
        aocc@5.2.0:
          environment:
            prepend_path:
              MODULEPATH: /sw/spack/chemistry/opt/modules/linux-rhel10-x86_64/aocc/5.2.0
        gcc@10.3.0:
          environment:
            prepend_path:
              MODULEPATH: /sw/spack/opt/Compilers/gcc/10.3.0/modules/linux-rhel10-x86_64/Core
        gcc@12.3.0:
          environment:
            prepend_path:
              MODULEPATH: /sw/spack/opt/Compilers/gcc/12.3.0/modules/linux-rhel10-x86_64/Core
        gcc@14.4.0:
          environment:
            prepend_path:
              PATH: /sw/spack/base-gcc/opt/gcc/14.4.0-gcc-14.3.1-oy7l/bin
              LD_LIBRARY_PATH: /sw/spack/base-gcc/opt/gcc/14.4.0-gcc-14.3.1-oy7l/lib64
              MANPATH: /sw/spack/base-gcc/opt/gcc/14.4.0-gcc-14.3.1-oy7l/share/man
              ACLOCAL_PATH: /sw/spack/base-gcc/opt/gcc/14.4.0-gcc-14.3.1-oy7l/share/aclocal
              PKG_CONFIG_PATH: /sw/spack/base-gcc/opt/gcc/14.4.0-gcc-14.3.1-oy7l/lib/pkgconfig
